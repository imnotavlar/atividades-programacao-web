<!--style apenas para deixar menor o fieldset para ficar parecido com o do exemplo do pdf-->
<style>
    fieldset {
        width: 175px; 
    }
</style>

<body>
    
    <form>
        <fieldset>
            <legend>dia:</legend>

            <div>
                <input type="checkbox" name="dia[]" value="segunda" checked> segunda feira
            </div>

            <div>
                <input type="checkbox" name="dia[]" value="terca"> terça feira
            </div>

            <div>
                <input type="checkbox" name="dia[]" value="quarta"> quarta feira
            </div>

            <div>
                <input type="checkbox" name="dia[]" value="quinta" checked> quinta feira
            </div>

            <div>
                <input type="checkbox" name="dia[]" value="sexta"> sexta feira
            </div>

            <div>
                <input type="checkbox" name="dia[]" value="sabado"> sabado
            </div>

            <div>
                <input type="checkbox" name="dia[]" value="domingo"> domingo
            </div>

             <br>
            <input type="submit" value="enviar">

    </fieldset>
</form>

</body>
</html>
